<header class="navbar">
  <div class="navbar-left">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="2" y="5" width="20" height="14" rx="2" />
        <line x1="2" y1="10" x2="22" y2="10" />
      </svg>
      <span class="logo-text">e-Banking</span>
    </div>
  </div>
  
  <div class="navbar-right">
    <div class="user-profile">
      <div class="avatar">
        <span>{{ (authService.username()?.substring(0, 2) || 'ME').toUpperCase() }}</span>
      </div>
      <div class="user-info">
        <span class="username">{{ authService.username() }}</span>
        <span class="role">{{ authService.isAdmin() ? 'Administrator' : 'User' }}</span>
      </div>
      
      <!-- Logout Button -->
      <button class="logout-btn" (click)="logout()" title="Sign Out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>
</header>
