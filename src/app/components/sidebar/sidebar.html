<aside class="sidebar">
  <nav class="nav-menu">
    <!-- Dashboard Link -->
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9" />
        <rect x="14" y="3" width="7" height="5" />
        <rect x="14" y="12" width="7" height="9" />
        <rect x="3" y="16" width="7" height="5" />
      </svg>
      <span class="nav-text">Dashboard</span>
    </a>

    <!-- Customers Link -->
    <a class="nav-item" routerLink="/customers" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
      <span class="nav-text">Customers</span>
    </a>

    <!-- Accounts Link -->
    <a class="nav-item" routerLink="/accounts" routerLinkActive="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="2" />
        <circle cx="12" cy="12" r="2" />
        <path d="M6 12h.01M18 12h.01" />
      </svg>
      <span class="nav-text">Accounts</span>
    </a>

    <!-- Transactions Link -->
    @if (authService.isAdmin()) {
      <a class="nav-item" routerLink="/transactions/transfer" routerLinkActive="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M4 4l5 5" />
        </svg>
        <span class="nav-text">Transactions</span>
      </a>
    }
  </nav>
</aside>
